name: Melee watcher

# The "Melee watcher" from docs/architecture.md, as a scheduled job:
#   bronze (R2) -> runner, discover recent Modern events, fetch the new ones,
#   runner -> bronze (R2).
#
# Runs twice a day around noon and midnight US Eastern: EU/Asia events publish
# in the US morning, NA events late at night. Minutes are off the hour because
# GitHub's cron queue is busiest at :00.
#
# Bronze never loses anything here: the download is a sync (the runner is
# disposable), the upload is a copy (never deletes in R2), and fetch itself is
# append-only and idempotent per event.

on:
  schedule:
    - cron: "17 4,16 * * *"   # 00:17 / 12:17 EDT; 23:17 / 11:17 EST
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest event date to consider (YYYY-MM-DD). Default: format period start."
        required: false
        type: string
      min_age_days:
        description: "Only fetch events that started at least this many days ago"
        required: false
        type: string
        default: "2"
      min_players:
        description: "Minimum enrolled players"
        required: false
        type: string
        default: "100"
      max_events:
        description: "Fetch at most this many new events this run (0 = all)"
        required: false
        type: string
        default: "0"

concurrency:
  group: melee-bronze
  cancel-in-progress: false   # never interrupt a run mid-fetch

env:
  MELEE_CONTACT_EMAIL: ${{ secrets.MELEE_CONTACT_EMAIL }}
  MELEE_REQUEST_INTERVAL: "2.5"
  # rclone reads its remote config from the environment: remote name "r2".
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  # No ACL: R2 answers 501 NotImplemented to any S3 feature it lacks, ACLs included.
  # The token is scoped to one bucket, so rclone must not try to CreateBucket first.
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
  BUCKET: mtgmeta-bronze

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a 1,500-player RC is ~65 min; backfills may need more
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          playwright install --with-deps chromium
          # Ubuntu's packaged rclone is years old; R2 needs a current build.
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: Pull bronze from R2
        run: |
          mkdir -p data/bronze
          rclone sync "r2:$BUCKET/bronze" data/bronze --fast-list
          echo "events in bronze: $(ls data/bronze/melee/events 2>/dev/null | wc -l)"

      - name: Check R2 is writable
        # Fail here, in the first minute, rather than after hours of fetching.
        run: |
          date -u +%FT%TZ | rclone rcat "r2:$BUCKET/_last_run_started"
          rclone cat "r2:$BUCKET/_last_run_started"

      - name: Discover recent events
        run: |
          # Melee's search is creation-ordered and big events are created months
          # ahead, so a short lookback stops paging before it reaches them. Scan
          # from the format period start every run (~15-20 min) until the
          # upcoming-events watchlist replaces this.
          SINCE="${{ inputs.since }}"
          if [ -z "$SINCE" ]; then SINCE="2026-05-18"; fi
          echo "discovering Modern events since $SINCE"
          python scripts/discover_melee.py --headless --since "$SINCE" \
            --min-players "${{ inputs.min_players || '100' }}"

      - name: Fetch new events
        # Stop starting events at 300 min so the job (limit 350) always ends on a
        # clean event boundary with time to push; leftovers go to the next run.
        run: |
          python scripts/fetch_melee_event.py --from-discovery \
            --min-age-days "${{ inputs.min_age_days || '2' }}" \
            --max-events "${{ inputs.max_events || '0' }}" \
            --budget-minutes 300

      - name: Push bronze to R2
        if: always()   # keep whatever completed, even if a later event failed
        run: |
          rclone copy data/bronze "r2:$BUCKET/bronze" --fast-list --stats-one-line -v
          echo "objects in R2: $(rclone size "r2:$BUCKET/bronze" --json)"

      - name: Keep this run's discovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: data/discovery/
          if-no-files-found: ignore
