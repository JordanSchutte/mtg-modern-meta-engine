# Archetype rules for Modern, period starting 2026-05-18 (post-B&R).
# Mined from 7,557 Melee lists on 2026-10-28, then named by hand. Edit freely:
# the classifier scores a list by how many signature cards it has; the rule
# with the most hits wins (ties: larger share of its signature, then priority).
# 'archetype' is the level the matchup matrix uses; 'variant' is the color/
# build label. 'note' is for people and ignored by the classifier.
# Optional per rule: colors (WUBRG letters the list must equal), excludes,
# priority. See src/mtgmeta/archetypes/rules.py.

